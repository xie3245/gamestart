<title>Slurpwave</title>
<style>
    html,
    body {
        margin: 0;
        height: 100%;
        background: #000;
    }

    #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    canvas {
        width: 100%;
        height: 100%;
        outline: none;
        image-rendering: pixelated;
        image-rendering: -moz-crisp-edges;
    }

    /* hide any default UI if present */
    #status,
    #controls,
    #progress,
    #output,
    #emscripten-logo {
        display: none !important;
    }
</style>

<body>
    <div id="game">
        <canvas id="canvas" tabindex="0"></canvas>
    </div>
    <script>
        // Let Emscripten/SDL use our canvas. Silence default prints.
        var Module = {
            canvas: document.getElementById('canvas'),
            print: function () { }, printErr: function () { }
        };
    </script>
